# Shared profile and build settings. Page content lives in pages/.
locale: en-US
title: "Xuqin Wang"
name: "Xuqin Wang"
description: "PhD researcher in generative AI, representation learning, and multimodal learning at TUM."
url: https://xuqinwang.github.io
baseurl: ""
repository: xuqinwang/xuqinwang.github.io
timezone: Europe/Berlin

author:
  name: Xuqin Wang
  avatar: wxq_jojo.png
  bio: "PhD student, Computer Vision Group, TUM"
  location: Munich, Germany
  email: wxqcn666@gmail.com
  github: xuqinwang
  linkedin: xuqin-wang
  googlescholar: "https://scholar.google.com/citations?user=YXGDPHEAAAAJ&hl=en"
  uri: https://cvg.cit.tum.de/members/wxu

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
sass:
  sass_dir: _sass
  style: compressed
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
exclude:
  - README.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - vendor
  - tests
  - package.json
  - node_modules
  - assets/js/_main.js
  - assets/js/plugins
  - assets/js/vendor
plugins:
  - jekyll-sitemap
  - jekyll-redirect-from
